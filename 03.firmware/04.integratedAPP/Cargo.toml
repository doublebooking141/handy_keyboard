[package]
name = "handy-keyboard"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
esp-idf-svc = { version = "0.49", default-features = false }
esp-idf-hal = { version = "0.44" }
esp-idf-sys = { version = "0.35" }

# LVGL GUI framework (TODO: Add configuration and re-enable)
# lvgl = { version = "0.6", default-features = false, features = ["embedded_graphics"] }
# lvgl-sys = { version = "0.6" }
# embedded-graphics = "0.8"

log = { version = "0.4" }
anyhow = "1"

[build-dependencies]
embuild = "0.32"
